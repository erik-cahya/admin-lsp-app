version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: admin-lsp-app
    container_name: admin-lsp-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - admin-lsp-network

  webserver:
    image: nginx:alpine
    container_name: admin-lsp-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx:/etc/nginx/conf.d
    networks:
      - admin-lsp-network

  db:
    image: mysql:8.0
    container_name: admin-lsp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laraveluser
      MYSQL_PASSWORD: laravelpassword
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - admin-lsp-network

networks:
  admin-lsp-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
